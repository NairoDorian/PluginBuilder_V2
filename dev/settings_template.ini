# =================================================================================================
# PluginBuilder settings.ini
#
#  Saved to:  %APPDATA%/IntentDev/PluginBuilder/settings.ini   (SetSettings.toe writes it for you)
#  ${USER_PATH} expands to %USERPROFILE%.
#
#  Only PluginBuilderDir is strictly required. Everything under [Paths] besides it is OPTIONAL:
#  when a value is empty PluginBuilder discovers the tool itself
#    - VCVarsall : via vswhere.exe (newest Visual Studio with the C++ x64 toolset)
#    - NinjaDir  : ninja.exe on PATH, then the Ninja bundled with Visual Studio's CMake component
#    - CMakeDir  : cmake.exe on PATH, then the CMake bundled with Visual Studio
# =================================================================================================

[Paths]
# Root of the PluginBuilder_V2 checkout (contains cmake/, include/, templates/, source/)
PluginBuilderDir = ${USER_PATH}/PluginBuilder_V2

# Optional overrides (leave empty to auto-detect)
NinjaDir =
VCVarsall =
CMakeDir =

# Optional: use a different SDK header directory than PluginBuilderDir/include
SdkIncludeDir =

[PluginInfo]
# Substituted into generated plugin sources (FillXXXPluginInfo)
Author = Your Name
Email = you@somewhere.com
HelpURL =

[Options]
# info | debug   (debug prints every runner event and copy decision)
LogLevel = info
# x64 (default) — passed to vcvarsall
Arch = x64
# Ninja parallel jobs (empty = ninja default)
ParallelJobs =
# Mirror the plugin's parameter pages onto the COMP (true) or flatten onto one 'Custom' page (false)
MirrorPages = true

# Uncomment to keep the creation parameters editable after Create Plugin (PluginBuilder development)
# [DevMode]
