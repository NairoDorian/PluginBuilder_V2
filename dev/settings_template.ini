# =================================================================================================
# PluginBuilder settings.ini Configuration Template
# 
# Instructions:
#  1. Edit paths to reflect your local toolchain setup.
#  2. Use ${USER_PATH} as a placeholder for %USERPROFILE% (Windows) or $HOME (macOS/Linux).
#  3. Saved configuration will be written to: %APPDATA%/IntentDev/PluginBuilder/settings.ini
# =================================================================================================

[Paths]
# Absolute path to the root PluginBuilder directory
PluginBuilderDir = ${USER_PATH}/PluginBuilder

# Directory containing ninja.exe
NinjaDir = ${USER_PATH}/ninja

# Absolute path to MSVC vcvarsall.bat environment initialization batch file
VCVarsall = C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Auxiliary/Build/vcvarsall.bat

[PluginInfo]
# Default author name and email substituted into generated C++ plugin source headers
Author = Your Name
Email = you@somewhere.com